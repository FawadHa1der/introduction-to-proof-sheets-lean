# Deploy: website/site/scripts/deploy.sh (builds, uploads the snapshots, then `wrangler deploy`).
name = "proof-sheets"
main = "edge/worker.js"
compatibility_date = "2026-08-01"

[assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = true          # required: the worker adds COOP/COEP to the page itself
not_found_handling = "none"
html_handling = "auto-trailing-slash"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "qed64-artifacts"  # the shared bucket that holds lean4-wasm64/<release id>/

[vars]
R2_PREFIX = "proof-sheets/"      # this site's keys: proof-sheets/snapshots/*, proof-sheets/profiles/index.json
